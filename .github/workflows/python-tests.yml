name: Python tests
on:
  push:
  pull_request:
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portable unit tests
        run: python3 -m unittest discover -s tests -v
